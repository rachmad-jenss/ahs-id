name: Verify AHS-ID web (Cloudflare Git deploy)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: web-production
  cancel-in-progress: true

# Production deployment is owned by the Cloudflare Workers Git integration.
# This workflow only verifies the exact commit that Cloudflare will build.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Build and validate web
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ahs-id/web... build
      - run: pnpm --filter @ahs-id/web test
      - run: pnpm --filter @ahs-id/web typecheck
      - run: pnpm --filter @ahs-id/web exec wrangler deploy --dry-run --env production
