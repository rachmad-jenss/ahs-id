[project]
name = "ahs-id-extractors"
version = "0.0.0"
description = "Locked Python environment for the tracked AHSP workbook extractors"
requires-python = ">=3.10"
dependencies = [
  "openpyxl>=3.1.5",
  "xlrd>=2.0.1",
  "xlwt>=1.3.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.uv]
package = false
