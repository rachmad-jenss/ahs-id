[project]
name = "ahs-id-docling"
version = "0.1.0"
description = "Docling-based PDF extraction and Layer 1 verification for AHS-ID bundles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "docling>=2.0.0",
  "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
ahs-docling = "ahs_id.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ahs_id"]
